<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f05007"/>
      <stop offset="100%" stop-color="#f57b0c"/>
    </linearGradient>
  </defs>
  <style>
    /* Default: dark mode — orange hex, white F */
    .hex  { fill: url(#orangeGrad); }
    .letter { fill: #ffffff; }

    @media (prefers-color-scheme: light) {
      /* Light mode — near-black hex, orange F */
      .hex    { fill: #111111; }
      .letter { fill: #f05007; }
    }
  </style>

  <!-- Hexagon -->
  <path class="hex" d="M25 10 L75 10 L95 50 L75 90 L25 90 L5 50 Z"/>

  <!-- Geometric F -->
  <g class="letter">
    <rect x="32" y="28" width="12" height="44"/>
    <rect x="44" y="28" width="26" height="10"/>
    <rect x="44" y="46" width="18" height="10"/>
  </g>
</svg>
