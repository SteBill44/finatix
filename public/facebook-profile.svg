<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="180" height="180">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="hexGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f05007"/>
      <stop offset="100%" stop-color="#f57b0c"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background circle fill (Facebook clips to circle) -->
  <rect width="180" height="180" fill="url(#bgGrad)"/>

  <!-- Subtle glow behind hex -->
  <ellipse cx="90" cy="82" rx="52" ry="52" fill="#f05007" opacity="0.12" filter="url(#glow)"/>

  <!-- Hexagon logo — centred, scaled to ~110px tall -->
  <g transform="translate(90,82) scale(1.08) translate(-50,-50)">
    <path
      d="M25 10 L75 10 L95 50 L75 90 L25 90 L5 50 Z"
      fill="url(#hexGrad)"
    />
    <!-- Geometric F -->
    <g fill="#ffffff">
      <rect x="32" y="28" width="12" height="44"/>
      <rect x="44" y="28" width="26" height="10"/>
      <rect x="44" y="46" width="18" height="10"/>
    </g>
  </g>

  <!-- Wordmark -->
  <text
    x="90"
    y="158"
    font-family="'Segoe UI', Arial, sans-serif"
    font-size="22"
    font-weight="700"
    text-anchor="middle"
    letter-spacing="1"
  >
    <tspan fill="#ffffff">Fin</tspan><tspan fill="#f05007">atix</tspan>
  </text>
</svg>
